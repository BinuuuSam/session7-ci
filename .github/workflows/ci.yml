name: Node.js CI

# Run this every time code is pushed, or a pull request is opened
on:
  push:
  pull_request:

jobs:
  build-and-test:
    # 1. Create the runner (a fresh Linux machine/container)
    runs-on: ubuntu-latest

    steps:
      # 2. Clone your code into the runner
      - name: Get the code
        uses: actions/checkout@v4

      # 3. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Install dependencies (none yet, but this is the normal step)
      - name: Install dependencies
        run: npm install

      # 5. Build
      - name: Build
        run: npm run build

      # 6. Run the tests
      - name: Run tests
        run: npm test
